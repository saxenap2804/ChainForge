services:
  node-a:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chainforge-node-a

    command:
      - startnode
      - --port
      - "8080"
      - --db
      - /data/node-a.db

    ports:
      - "8080:8080"

    volumes:
      - node-a-data:/data

    environment:
      CHAINFORGE_PEERS: "http://node-b:8081"

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

    networks:
      - chainforge-network


  node-b:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chainforge-node-b

    command:
      - startnode
      - --port
      - "8081"
      - --db
      - /data/node-b.db

    ports:
      - "8081:8081"

    volumes:
      - node-b-data:/data

    environment:
      CHAINFORGE_PEERS: "http://node-a:8080"

    depends_on:
      node-a:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8081/health
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

    networks:
      - chainforge-network


volumes:
  node-a-data:
  node-b-data:


networks:
  chainforge-network:
    driver: bridge